; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; platform/board differ per environment (ESP8266 vs ESP32-S3 hardware), so they're set per-env
; below rather than shared here - only framework/lib_deps are common to all targets.
[env]
framework = arduino
lib_deps =
	256dpi/MQTT@^2.5.1
	bblanchon/ArduinoJson@^6.21.1
	fastled/FastLED@^3.9.0

; Controller variant is selected by build_flags, same pattern as SDM-Universal-Env/Somfy-Control's
; device selection - so picking the wrong upload target can't silently build against the wrong
; button-write mechanism.
;
; Z suffix controllers (GS500Z/GS501Z + VL2xx/VL4xx panels): 4 discrete button GPIO lines.
; This is the only variant actually implemented/tested - see src/Balboa-GS-WiFi.cpp.
;
; board = d1_mini (not d1_mini_pro) per the rest of this fleet's convention - see
; Somfy-Control/platformio.ini for why (a d1_mini_pro build assumes a bigger flash chip than
; these boards actually have and fails OTA with "Flash config wrong"). The original repo's
; header comment just says "Custom PCB - esp8266"; confirm actual flash size before relying on
; OTA if this board turns out to differ.
;
; IP confirmed via network scan (root page still returns this project's old boot string). Note:
; the board is currently running an older ElegantOTA-based build, not ArduinoOTA - the very
; first upload after this rewrite must go through ElegantOTA's web endpoint instead
; (http://10.10.10.115/update, or `curl -F "file=@.pio/build/z/firmware.bin" http://10.10.10.115/update`),
; since ArduinoOTA isn't listening on the device yet. Once that one-time switch-over flash is
; done, `pio run -e z -t upload` will work directly via espota as configured below.
; --auth must match OTA_PASSWORD in src/secrets.h (gitignored, see src/secrets.h.example) -
; read from the OTA_AUTH environment variable rather than hardcoded here, e.g.
;   OTA_AUTH=yourpassword pio run -e z -t upload
[env:z]
platform = espressif8266
board = d1_mini
build_flags = -D CONTROLLER_Z
upload_protocol = espota
upload_port = 10.10.10.115
upload_flags =
	--port=8266
	--auth=${sysenv.OTA_AUTH}

; SZ/D suffix controllers (VL6xx/VL7xx/VL8xx panels): buttons are multiplexed onto one shared
; data line instead of 4 discrete GPIOs - a fundamentally different write mechanism that isn't
; implemented here yet (no reference hardware available - see README's links to MagnusPer's and
; Shuraxxx's repos for protocol details). This environment intentionally fails to build until
; that's written, rather than silently compiling something that doesn't work on SZ/D hardware.
[env:sz]
platform = espressif8266
board = d1_mini
build_flags = -D CONTROLLER_SZ

; ESP32-S3-WROOM-1-N8 (8MB flash, no PSRAM) prototyping target - see README's ESP32 migration
; notes. board id matches the module exactly (PlatformIO's "ESP32-S3-DevKitC-1-N8 (8 MB QD, No
; PSRAM)"). No upload_port/protocol set - no OTA firmware exists on this hardware yet, so this
; uploads over USB (esptool auto-detects the port) until a first flash establishes ArduinoOTA.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = -D CONTROLLER_Z
